<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/all.css" />
    <script type="module" src="../js/search.js" defer></script>
    <title>DevScope</title>
  </head>
  <body>
    <header class="flex justify-center align-center w-full text-white">
      <div class="flex justify-between align-center w-[60%] m-5">
        <a href="../index.html"
          ><h1 id="site-icon" class="font-black lighting">DevScope</h1></a
        >
        <span class="flex justify-between align-center gap-4">
          <a href="../index.html" id="accueil" class="hover:text-blue-300"
            >Accueil</a
          >
          <a href="./search.html" id="recherche" class="text-blue-300"
            >Recherche</a
          >
          <a href="./shortlist.html" id="shortlist" class="hover:text-blue-300"
            >ShortList</a
          >
        </span>
      </div>
    </header>

    <main
      class="flex flex-col items-center justify-center p-10 text-white w-full h-[80vh] gap-5"
    >
      <p class="mb-5 text-2xl cursor typewriter-animation">
        Analysez un profil, ses projets et ses langages en quelques secondes.
      </p>
      <form
        action=""
        class="flex align-center gap-2 p-2 w-[40%] border rounded-lg"
      >
        <i class="material-icons">&#xe8b6;</i>
        <input
          type="text"
          name="user"
          id="user"
          class="flex-4"
          placeholder="Entrez un nom d'utillisateur..."
        />
        <button
          type="submit"
          id="analyser"
          class="flex-1 hover:text-blue-300"
          disabled
        >
          Analyser &#8594;
        </button>
      </form>
      <p id="error-msg" class="text-red-500 hidden">
        Nom d`utilisateur invalide : lettres, chiffres et tirets uniquement.
      </p>
    </main>
  </body>
</html>
