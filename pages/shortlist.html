<!doctype html>
<html lang="fr" class="scrollbar-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/fontawesome.css"
      integrity="sha512-cOd3Jjo4vXG7cyt5/gEQgxwL6c7THvNQxSZphogpsFKsnbgeqEWa7Xsyf7zvDMpdmDAhiUUJGQPc5R3pocvnBQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../css/all.css" />
    <script type="module" src="../js/shortlist.js" defer></script>
    <title>DevScope</title>
  </head>

  <body class="text-white">
    <header class="flex justify-center align-center w-full text-white">
      <div class="flex justify-between align-center w-[60%] m-5">
        <a href="../index.html"
          ><h1 id="site-icon" class="font-black lighting">DevScope</h1></a
        >
        <span class="flex justify-between align-center gap-4">
          <a href="../index.html" id="accueil" class="hover:text-blue-300"
            >Accueil</a
          >
          <a href="./search.html" id="recherche" class="hover:text-blue-300"
            >Recherche</a
          >
          <a href="./shortlist.html" id="shortlist" class="text-blue-300"
            >ShortList</a
          >
        </span>
      </div>
    </header>

    <main class="h-full w-[80%] ml-[10%] mt-7 mb-5">
      <h2 class="text-4xl text-blue-300">Ma shortlist</h2>
      <p id="candidats-num">0 candidat(s) dans votre shortlist</p>

      <div class="flex justify-between gap-5 align-centre mt-5">
        <div class="flex gap-3 p-1 mr-5 border rounded-lg">
          <button class="text-blue-300">Tous</button>
          <button class="hover:text-blue-300">A contacter</button>
          <button class="hover:text-blue-300">Entretien</button>
          <button class="hover:text-blue-300">Retenu</button>
          <button class="hover:text-blue-300">Refuse</button>
        </div>
        <span
          class="flex flex-2 align-center gap-2 p-2 w-[40%] border rounded-lg"
        >
          <i class="material-icons">&#xe8b6;</i>
          <input
            type="text"
            class="flex-4"
            placeholder="Entrez un nom d'utillisateur..."
          />
        </span>
      </div>

      <div
        id="no-user"
        class="flex justify-center items-center w-full mt-7 hidden"
      >
        <p class="text-3xl">Aucun utillisateur!</p>
      </div>

      <div
        id="users-container"
        class="flex flex-col justify-center align-center gap-4 mt-5 rounded-lg"
      ></div>
      <template id="users-template">
        <div
          class="user-card flex justify-between items-center p-5 bg-indigo-950 rounded-lg"
        >
          <div class="flex items-center gap-3">
            <div
              class="profile-pic w-[50px] h-[50px] bg-white rounded-full"
            ></div>
            <div class="flex flex-col gap-1">
              <p class="name font-bold">Mohamed Qaddoura</p>
              <span class="flex items-center gap-1">
                <p class="user text-gray-400">@MohamedQaddoura</p>
                <small
                  class="most-lang text-sm text-cyan-300 border rounded-md"
                >
                  JavaScript
                </small>
              </span>

              <i class="note">note</i>
              <p class="add-time text-sm">Ajoute le 01/01/1970</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <p class="rate text-yellow-300">
              &#9733;&#9733;&#9733;&#9733;&#9733;
            </p>
            <p class="text-red-500 border rounded-md p-1">&#9679; REFUSE</p>
            <button
              class="btn-modify border rounded-md p-1 hover:text-yellow-300"
            >
              &#9998; Modifier
            </button>
            <button
              class="btn-delete text-red-500 border rounded-md p-1 hover:text-red-300"
            >
              &#10006; Supprimer
            </button>
          </div>
        </div>
      </template>
    </main>

    <section
      id="delete"
      class="flex justify-center items-center fixed inset-0 backdrop-blur-sm hidden"
    >
      <div
        class="flex flex-col justify-between items-center w-[40%] h-[40%] bg-indigo-950 rounded-lg p-3"
      >
        <span class="flex justify-between items-center w-full">
          <h3 class="text-2xl">Supprimer candidat</h3>
          <button class="exit-delete hover:text-blue-200">X</button>
        </span>
        <p class="text-xl">Êtes-vous sûr de vouloir supprimer ce candidat ?</p>
        <span class="flex justify-center items-center gap-5"
          ><button
            class="exit-delete p-1 border rounded-lg hover:text-blue-200"
          >
            Annuler</button
          ><button
            id="confirm-delete"
            class="p-1 border rounded-lg text-red-500 hover:text-red-300"
          >
            Supprimer
          </button></span
        >
      </div>
    </section>
  </body>
</html>
